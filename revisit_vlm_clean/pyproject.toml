[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revisit-vlm-clean"
version = "0.1.0"
description = "Clean TGVF project skeleton and contracts."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
tgvf_build_manifest = "revisit_vlm_clean.cli.manifest:main"
tgvf_eval_benchmark = "revisit_vlm_clean.cli.benchmark:main"
tgvf_generate_data = "revisit_vlm_clean.cli.generate_data:main"
tgvf_train_stage1 = "revisit_vlm_clean.cli.train_stage1:main"
tgvf_train_stage2 = "revisit_vlm_clean.cli.train_stage2:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
