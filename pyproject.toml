[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revisit-vlm"
version = "0.1.0"
description = "Editable Qwen2-VL research and fine-tuning scaffold."
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.33.0",
    "datasets>=2.20.0",
    "flash-attn>=2.8.3",
    "peft>=0.12.0",
    "pillow>=10.0.0",
    "qwen-vl-utils>=0.0.8",
    "torch>=2.11,<2.12",
    "torchvision>=0.26,<0.27",
    "transformers>=4.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]
teacher = [
    "openai>=1.60.0",
]
tracking = [
    "wandb>=0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.pytest.ini_options]
markers = [
    "integration: tests that require optional model weights, CUDA, or external artifacts",
]
